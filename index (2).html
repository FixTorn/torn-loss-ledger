<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loss Ledger — Torn loss-selling tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#15171b; --panel:#1a1c20; --panel2:#1c1f26; --line:#262a31; --line2:#2c2f36;
    --text:#e8e4d8; --text2:#dcd8cc; --muted:#8b8f98; --muted2:#6b6f78;
    --gold:#c9a24b; --gold-dark:#1a1c20; --rust:#c98a4b; --green:#6fae7c;
    --ok-bg:#1c2a20; --ok-text:#8fc99a; --ok-border:#2a3f2e;
    --warn-bg:#2c2318; --warn-text:#dba86b; --warn-border:#4a3a24;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;}
  input,button,select,textarea{font-family:'Inter',sans-serif;}
  input::placeholder,textarea::placeholder{color:#6b6f78;}
  button{cursor:pointer;}
  table{border-collapse:collapse;width:100%;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:#33363e;border-radius:4px;}
  .app{max-width:920px;margin:0 auto;min-height:100vh;padding-bottom:40px;}
  .header{display:flex;justify-content:space-between;align-items:flex-start;padding:28px 24px 18px;border-bottom:1px solid var(--line);}
  .brand{font-family:'Zilla Slab',serif;font-size:26px;font-weight:700;}
  .brand-sub{font-size:13px;color:var(--muted);margin-top:4px;}
  .header-actions{display:flex;gap:8px;}
  .icon-btn{display:flex;align-items:center;gap:6px;background:var(--gold);color:#1a1c20;border:none;padding:9px 16px;border-radius:6px;font-size:13px;font-weight:600;}
  .icon-btn:disabled{opacity:0.6;}
  .icon-btn-ghost{display:flex;align-items:center;justify-content:center;background:transparent;color:#a8adb6;border:1px solid var(--line2);width:36px;height:36px;border-radius:6px;font-size:16px;}
  .spin{display:inline-block;animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .banner{margin:14px 24px 0;padding:10px 14px;border-radius:6px;font-size:13px;display:flex;align-items:center;gap:8px;}
  .banner-ok{background:var(--ok-bg);color:var(--ok-text);border:1px solid var(--ok-border);}
  .banner-warn{background:var(--warn-bg);color:var(--warn-text);border:1px solid var(--warn-border);}
  .paste-block{margin:14px 24px 0;padding:16px;background:var(--panel2);border-radius:8px;border:1px solid var(--line2);}
  .paste-label{font-size:13px;color:#c3c7cf;margin-bottom:8px;}
  .url-code{display:block;font-size:12px;color:var(--gold);background:#111318;padding:8px 10px;border-radius:5px;margin-bottom:10px;overflow-x:auto;white-space:nowrap;}
  textarea.paste-area{width:100%;background:#111318;border:1px solid var(--line2);border-radius:6px;color:var(--text);padding:10px;font-size:12px;margin-bottom:10px;resize:vertical;}
  .summary-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);margin:20px 24px 0;border-radius:8px;overflow:hidden;}
  .summary-cell{background:var(--panel);padding:16px 18px;}
  .summary-value{font-family:'Zilla Slab',serif;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;}
  .summary-label{font-size:12px;color:var(--muted);margin-top:4px;}
  .tabs{display:flex;gap:4px;margin:20px 24px 0;border-bottom:1px solid var(--line);}
  .tab-btn{display:flex;align-items:center;gap:6px;background:none;border:none;color:var(--muted);padding:10px 14px;font-size:13px;border-bottom:2px solid transparent;}
  .tab-btn.active{color:var(--text);border-bottom:2px solid var(--gold);}
  .main{padding:22px 24px 0;}
  .section-head{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:600;margin-bottom:12px;color:#c3c7cf;}
  table{font-size:13.5px;}
  thead tr{border-bottom:1px solid var(--line2);}
  th{text-align:left;padding:8px 10px;color:var(--muted);font-weight:500;font-size:12px;}
  th.num{text-align:right;}
  tbody tr{border-bottom:1px solid #1f2229;}
  td{padding:10px 10px;color:var(--text2);}
  td.num{text-align:right;font-variant-numeric:tabular-nums;}
  .balance-pos{color:var(--rust);font-weight:600;}
  .balance-zero{color:var(--green);font-weight:600;}
  .empty{color:var(--muted2);font-size:13.5px;padding:24px 4px;line-height:1.6;}
  .payment-form{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  select,input[type=text],input[type=number],input[type=password]{background:var(--panel2);border:1px solid var(--line2);color:var(--text);padding:9px 10px;border-radius:6px;font-size:13px;min-width:140px;}
  select{min-width:220px;}
  .primary-btn{display:flex;align-items:center;gap:6px;background:var(--gold);color:#1a1c20;border:none;padding:9px 16px;border-radius:6px;font-size:13px;font-weight:600;}
  .primary-btn:disabled{opacity:0.5;}
  .ghost-btn{background:transparent;color:#a8adb6;border:1px solid var(--line2);padding:9px 16px;border-radius:6px;font-size:13px;}
  .ghost-btn-small{display:flex;align-items:center;gap:5px;background:transparent;color:#a8adb6;border:1px solid var(--line2);padding:6px 10px;border-radius:5px;font-size:12px;}
  .delete-btn{background:transparent;border:none;color:var(--muted2);padding:4px;border-radius:4px;font-size:14px;}
  .settings-form{max-width:420px;display:flex;flex-direction:column;}
  .label{font-size:12.5px;color:#a8adb6;margin-bottom:6px;font-weight:500;display:block;}
  .hint{font-size:12px;color:var(--muted2);margin-top:6px;line-height:1.5;}
</style>
</head>
<body>
<div id="root" class="app"></div>

<script>
const LOSS_RESULTS = new Set(["Attacked","Hospitalized","Mugged","Special","Looted"]);
const fmt = n => "$" + Math.round(n).toLocaleString("en-US");
const fmtDate = ts => new Date(ts*1000).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});

function load(key, fallback){
  try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }catch(e){ return fallback; }
}
function save(key, value){
  try{ localStorage.setItem(key, JSON.stringify(value)); return true; }
  catch(e){ console.error("save failed", key, e); return false; }
}

let state = {
  tab: "balances",
  settings: load("tll_settings", { apiKey:"", rate:250000, ownId:null, ownName:"" }),
  losses: load("tll_losses", []),
  payments: load("tll_payments", []),
  syncState: { status:"idle", message:"" },
  showPaste: false,
  pasteBox: "",
  paymentDraft: { payerId:"", amount:"", note:"" },
  settingsMessage: null,
  rateInput: null,
  keyInput: null,
};
state.rateInput = String(state.settings.rate);
state.keyInput = state.settings.apiKey;

function setState(patch){ state = {...state, ...patch}; render(); }

function mergeAttacks(attacksObj, ownId, existingLosses, rate){
  const existingIds = new Set(existingLosses.map(l=>l.id));
  const fresh = [];
  for(const [attackId, a] of Object.entries(attacksObj || {})){
    if(String(a.defender_id) !== String(ownId)) continue;
    if(!LOSS_RESULTS.has(a.result)) continue;
    if(existingIds.has(attackId)) continue;
    fresh.push({
      id: attackId,
      attackerId: String(a.attacker_id),
      attackerName: a.attacker_name || ("#"+a.attacker_id),
      timestamp: a.timestamp_ended || a.timestamp_started,
      rate,
    });
  }
  return fresh;
}

// ---- payment auto-detection (best-effort pattern match on the activity log) ----
function allStrings(obj, acc){
  acc = acc || [];
  if(!obj || typeof obj !== "object") return acc;
  for(const v of Object.values(obj)){
    if(typeof v === "string") acc.push(v);
    else if(typeof v === "object" && v) allStrings(v, acc);
  }
  return acc;
}
function findMoneyValue(obj){
  if(!obj || typeof obj !== "object") return null;
  for(const [k,v] of Object.entries(obj)){
    if(/money|amount|cash|value/i.test(k)){
      if(typeof v === "number" && v > 0) return v;
      if(typeof v === "string"){ const n = Number(v.replace(/[^0-9.-]/g,"")); if(!isNaN(n) && n>0) return n; }
    }
  }
  for(const v of Object.values(obj)){
    if(typeof v === "object" && v){ const r = findMoneyValue(v); if(r) return r; }
  }
  return null;
}
function isOutgoingMoneyLog(entry){
  const cat = (entry.category || "").toLowerCase();
  const title = (entry.title || "").toLowerCase();
  const looksLikeMoney = cat.includes("money") || title.includes("money") || title.includes("cash");
  const looksOutgoing = /sent|send|gave|give|transfer/.test(title);
  const looksIncoming = /receiv/.test(title);
  return looksLikeMoney && looksOutgoing && !looksIncoming;
}
function detectPayments(logObj, payers, existingPayments){
  const existingIds = new Set(existingPayments.map(p=>p.id));
  const fresh = [];
  for(const [logId, entry] of Object.entries(logObj || {})){
    const pid = "log-" + logId;
    if(existingIds.has(pid)) continue;
    if(!isOutgoingMoneyLog(entry)) continue;
    const amount = findMoneyValue(entry.data) || findMoneyValue(entry.params);
    if(!amount) continue;
    const haystack = allStrings({data: entry.data, params: entry.params, title: entry.title}).join(" | ").toLowerCase();
    const matchedPayer = payers.find(p => p.name && haystack.includes(p.name.toLowerCase()));
    if(!matchedPayer) continue; // only auto-record sends that match someone already on your loss ledger
    fresh.push({
      id: pid, payerId: matchedPayer.id, payerName: matchedPayer.name, amount,
      note: "Auto-detected", source: "auto",
      timestamp: entry.timestamp || Math.floor(Date.now()/1000),
    });
  }
  return fresh;
}

async function runSync(){
  if(!state.settings.apiKey){
    setState({ syncState:{status:"error", message:"Add your Torn API key in Settings first."}, tab:"settings" });
    return;
  }
  setState({ syncState:{status:"loading", message:""} });
  let res, data;
  try{
    res = await fetch(`https://api.torn.com/user/?selections=attacks,basic,log&key=${encodeURIComponent(state.settings.apiKey)}`);
  }catch(networkErr){
    // fetch() itself threw: this is the real CORS/network-failure case
    setState({ showPaste:true, syncState:{status:"blocked", message:"Direct sync didn't go through — a network or browser restriction blocked the request. Paste the API response manually below."} });
    return;
  }
  try{
    data = await res.json();
  }catch(parseErr){
    setState({ showPaste:true, syncState:{status:"blocked", message:"Got a response but couldn't read it as JSON. Paste the API response manually below."} });
    return;
  }
  if(data.error){
    // the request succeeded — Torn's API is telling us something specific, e.g. bad key or missing selection
    setState({ syncState:{status:"error", message:`Torn API error: ${data.error.error} (code ${data.error.code}). Check your key and its selections in Settings.`}, tab:"settings" });
    return;
  }
  const ownId = data.player_id;
  const ownName = data.name;
  const fresh = mergeAttacks(data.attacks, ownId, state.losses, state.settings.rate);
  const nextSettings = {...state.settings, ownId, ownName};
  save("tll_settings", nextSettings);
  let nextLosses = state.losses;
  if(fresh.length){ nextLosses = [...state.losses, ...fresh]; save("tll_losses", nextLosses); }
  const payersForMatch = computePayersFrom(nextLosses, state.payments);
  const freshPayments = detectPayments(data.log, payersForMatch, state.payments);
  let nextPayments = state.payments;
  if(freshPayments.length){ nextPayments = [...state.payments, ...freshPayments]; save("tll_payments", nextPayments); }
  const parts = [`${fresh.length} new loss${fresh.length===1?"":"es"}`, `${freshPayments.length} payment${freshPayments.length===1?"":"s"} detected`];
  setState({ settings: nextSettings, losses: nextLosses, payments: nextPayments, showPaste:false,
    syncState:{status:"success", message:`Synced. ${parts.join(", ")}.`} });
}

function parsePasted(){
  try{
    const data = JSON.parse(state.pasteBox);
    if(data.error) throw new Error(data.error.error || "Torn API returned an error");
    const ownId = data.player_id ?? state.settings.ownId;
    const ownName = data.name ?? state.settings.ownName;
    if(!ownId) throw new Error("Missing player_id — make sure the URL includes the 'basic' selection too.");
    const fresh = mergeAttacks(data.attacks, ownId, state.losses, state.settings.rate);
    const nextSettings = {...state.settings, ownId, ownName};
    save("tll_settings", nextSettings);
    let nextLosses = state.losses;
    if(fresh.length){ nextLosses = [...state.losses, ...fresh]; save("tll_losses", nextLosses); }
    const payersForMatch = computePayersFrom(nextLosses, state.payments);
    const freshPayments = data.log ? detectPayments(data.log, payersForMatch, state.payments) : [];
    let nextPayments = state.payments;
    if(freshPayments.length){ nextPayments = [...state.payments, ...freshPayments]; save("tll_payments", nextPayments); }
    const parts = [`${fresh.length} new loss${fresh.length===1?"":"es"}`, `${freshPayments.length} payment${freshPayments.length===1?"":"s"} detected`];
    setState({ settings: nextSettings, losses: nextLosses, payments: nextPayments, pasteBox:"",
      syncState:{status:"success", message:`Parsed pasted data. ${parts.join(", ")}.`} });
  }catch(e){
    setState({ syncState:{status:"error", message:"Couldn't parse that — " + e.message} });
  }
}

function computePayersFrom(losses, payments){
  const map = new Map();
  for(const l of losses){
    if(!map.has(l.attackerId)) map.set(l.attackerId, {id:l.attackerId, name:l.attackerName, count:0, owed:0});
    const p = map.get(l.attackerId);
    p.count += 1; p.owed += l.rate; p.name = l.attackerName;
  }
  for(const pay of payments){
    if(!map.has(pay.payerId)) map.set(pay.payerId, {id:pay.payerId, name:pay.payerName, count:0, owed:0});
  }
  const list = Array.from(map.values()).map(p=>{
    const paid = payments.filter(pay=>pay.payerId===p.id).reduce((s,pay)=>s+pay.amount,0);
    return {...p, paid, balance: p.owed - paid};
  });
  list.sort((a,b)=>b.balance-a.balance);
  return list;
}
function computePayers(){ return computePayersFrom(state.losses, state.payments); }

function recordPayment(){
  const payers = computePayers();
  const payer = payers.find(p=>p.id===state.paymentDraft.payerId);
  const amt = Number(state.paymentDraft.amount);
  if(!payer || !amt || amt<=0) return;
  const entry = {
    id: Date.now()+"-"+Math.random().toString(36).slice(2,7),
    payerId: payer.id, payerName: payer.name, amount: amt,
    note: state.paymentDraft.note, timestamp: Math.floor(Date.now()/1000),
  };
  const nextPayments = [...state.payments, entry];
  save("tll_payments", nextPayments);
  setState({ payments: nextPayments, paymentDraft:{payerId:"",amount:"",note:""} });
}

function deletePayment(id){
  const nextPayments = state.payments.filter(p=>p.id!==id);
  save("tll_payments", nextPayments);
  setState({ payments: nextPayments });
}

function exportCSV(){
  const payers = computePayers();
  const rows = [["Payer","Losses","Owed","Paid","Balance"]];
  for(const p of payers) rows.push([p.name,p.count,p.owed,p.paid,p.balance]);
  const csv = rows.map(r=>r.join(",")).join("\n");
  const blob = new Blob([csv], {type:"text/csv"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "loss-ledger.csv"; a.click();
  URL.revokeObjectURL(url);
}

function saveSettings(){
  const nextSettings = {...state.settings, apiKey: state.keyInput, rate: Number(state.rateInput) || state.settings.rate};
  const ok = save("tll_settings", nextSettings);
  if(!ok){
    setState({ settingsMessage: { type:"error", text:"Save failed — your browser may be blocking local storage (private/incognito mode, or storage disabled)." } });
    return;
  }
  // verify it actually persisted by reading it back
  const readBack = load("tll_settings", null);
  const verified = readBack && readBack.apiKey === nextSettings.apiKey && readBack.rate === nextSettings.rate;
  setState({
    settings: nextSettings,
    settingsMessage: verified
      ? { type:"ok", text:"Settings saved." }
      : { type:"error", text:"Save didn't verify — try again, or check if your browser allows local storage for this site." }
  });
}

function el(tag, props={}, children=[]){
  const e = document.createElement(tag);
  for(const [k,v] of Object.entries(props)){
    if(k==="text") e.textContent = v;
    else if(k==="html") e.innerHTML = v;
    else if(k.startsWith("on")) e.addEventListener(k.slice(2).toLowerCase(), v);
    else if(k==="class") e.className = v;
    else e.setAttribute(k, v);
  }
  for(const c of [].concat(children)) if(c) e.appendChild(typeof c==="string" ? document.createTextNode(c) : c);
  return e;
}

function render(){
  const root = document.getElementById("root");
  root.innerHTML = "";
  const payers = computePayers();
  const totals = {
    owed: payers.reduce((s,p)=>s+p.owed,0),
    paid: payers.reduce((s,p)=>s+p.paid,0),
  };
  totals.balance = totals.owed - totals.paid;

  // header
  const header = el("div",{class:"header"},[
    el("div",{},[
      el("div",{class:"brand",text:"Loss Ledger"}),
      el("div",{class:"brand-sub",text: state.settings.ownName ? `Tracking for ${state.settings.ownName}` : "Torn loss-selling tracker"}),
    ]),
    el("div",{class:"header-actions"},[
      el("button",{class:"icon-btn", onclick: runSync}, [
        el("span",{class: state.syncState.status==="loading" ? "spin" : "", html:"&#8635;"}),
        el("span",{text:" Sync"}),
      ]),
      el("button",{class:"icon-btn-ghost", onclick: ()=>setState({tab:"settings"}), title:"Settings", html:"&#9881;"}),
    ]),
  ]);
  root.appendChild(header);

  if(state.syncState.message){
    const warn = state.syncState.status==="error" || state.syncState.status==="blocked";
    root.appendChild(el("div",{class:"banner " + (warn?"banner-warn":"banner-ok")},[
      el("span",{text: warn ? "⚠ " : "✓ "}),
      el("span",{text: state.syncState.message}),
    ]));
  }

  if(state.showPaste){
    const block = el("div",{class:"paste-block"});
    block.appendChild(el("div",{class:"paste-label",text:"Open this URL in a new tab, copy everything on the page, and paste it below:"}));
    block.appendChild(el("code",{class:"url-code",text:`https://api.torn.com/user/?selections=attacks,basic,log&key=${state.settings.apiKey ? "•••your key•••" : "YOUR_KEY"}`}));
    const ta = el("textarea",{class:"paste-area",rows:"5",placeholder:"Paste the raw JSON response here…"});
    ta.value = state.pasteBox;
    ta.addEventListener("input", e=>{ state.pasteBox = e.target.value; });
    block.appendChild(ta);
    const row = el("div",{style:"display:flex;gap:8px;"});
    row.appendChild(el("button",{class:"primary-btn",text:"Parse pasted data", onclick: parsePasted}));
    row.appendChild(el("button",{class:"ghost-btn",text:"Dismiss", onclick: ()=>setState({showPaste:false})}));
    block.appendChild(row);
    root.appendChild(block);
  }

  // summary strip
  const strip = el("div",{class:"summary-strip"});
  [["Total owed",fmt(totals.owed)],["Total paid",fmt(totals.paid)],["Outstanding",fmt(totals.balance)],["Payers",String(payers.length)]].forEach(([label,value])=>{
    strip.appendChild(el("div",{class:"summary-cell"},[
      el("div",{class:"summary-value",text:value}),
      el("div",{class:"summary-label",text:label}),
    ]));
  });
  root.appendChild(strip);

  // tabs
  const tabs = el("div",{class:"tabs"});
  [["balances","Balances"],["payments","Payments"],["log","Loss log"],["settings","Settings"]].forEach(([key,label])=>{
    tabs.appendChild(el("button",{class:"tab-btn"+(state.tab===key?" active":""), text:label, onclick: ()=>setState({tab:key})}));
  });
  root.appendChild(tabs);

  const main = el("div",{class:"main"});
  root.appendChild(main);

  if(state.tab==="balances"){
    const head = el("div",{class:"section-head"},[el("span",{text:"Who owes what"})]);
    if(payers.length>0) head.appendChild(el("button",{class:"ghost-btn-small", text:"⬇ Export CSV", onclick: exportCSV}));
    main.appendChild(head);
    if(payers.length===0){
      main.appendChild(el("div",{class:"empty",text:"No losses logged yet. Sync with Torn to pull in your attack log, then losses matched against your rate will show up here."}));
    } else {
      const table = el("table");
      const thead = el("thead",{},[el("tr",{},["Payer","Losses","Owed","Paid","Balance"].map((h,i)=>el("th",{class:i>0?"num":"",text:h})))]);
      const tbody = el("tbody");
      payers.forEach(p=>{
        const balClass = p.balance>0 ? "balance-pos" : "balance-zero";
        tbody.appendChild(el("tr",{},[
          el("td",{text:p.name}),
          el("td",{class:"num",text:String(p.count)}),
          el("td",{class:"num",text:fmt(p.owed)}),
          el("td",{class:"num",text:fmt(p.paid)}),
          el("td",{class:"num "+balClass,text:fmt(p.balance)}),
        ]));
      });
      table.appendChild(thead); table.appendChild(tbody);
      main.appendChild(table);
    }
  }

  if(state.tab==="payments"){
    main.appendChild(el("div",{class:"section-head"},[el("span",{text:"Record a payment"})]));
    const form = el("div",{class:"payment-form"});
    const select = el("select");
    select.appendChild(el("option",{value:"",text:"Select payer…"}));
    payers.forEach(p=>{
      const opt = el("option",{value:p.id,text:`${p.name} — balance ${fmt(p.balance)}`});
      if(state.paymentDraft.payerId===p.id) opt.selected = true;
      select.appendChild(opt);
    });
    select.addEventListener("change", e=>{ state.paymentDraft.payerId = e.target.value; });
    form.appendChild(select);

    const amountInput = el("input",{type:"number",placeholder:"Amount paid"});
    amountInput.value = state.paymentDraft.amount;
    amountInput.addEventListener("input", e=>{ state.paymentDraft.amount = e.target.value; });
    form.appendChild(amountInput);

    const noteInput = el("input",{type:"text",placeholder:"Note (optional)"});
    noteInput.value = state.paymentDraft.note;
    noteInput.addEventListener("input", e=>{ state.paymentDraft.note = e.target.value; });
    form.appendChild(noteInput);

    const addBtn = el("button",{class:"primary-btn",text:"+ Add", onclick: recordPayment});
    if(!state.paymentDraft.payerId || !state.paymentDraft.amount) addBtn.disabled = true;
    form.appendChild(addBtn);
    main.appendChild(form);

    main.appendChild(el("div",{class:"section-head",style:"margin-top:28px;"},[el("span",{text:"Payment history"})]));
    if(state.payments.length===0){
      main.appendChild(el("div",{class:"empty",text:"No payments recorded yet."}));
    } else {
      const table = el("table");
      const thead = el("thead",{},[el("tr",{},["Date","Payer","Amount","Note",""].map((h,i)=>el("th",{class:i===2?"num":"",text:h})))]);
      const tbody = el("tbody");
      [...state.payments].reverse().forEach(p=>{
        const delBtn = el("button",{class:"delete-btn",text:"✕",title:"Remove", onclick: ()=>deletePayment(p.id)});
        tbody.appendChild(el("tr",{},[
          el("td",{text:fmtDate(p.timestamp)}),
          el("td",{text:p.payerName}),
          el("td",{class:"num",text:fmt(p.amount)}),
          el("td",{text: p.source==="auto" ? "Auto-detected" : (p.note || "—")}),
          el("td",{},[delBtn]),
        ]));
      });
      table.appendChild(thead); table.appendChild(tbody);
      main.appendChild(table);
    }
  }

  if(state.tab==="log"){
    main.appendChild(el("div",{class:"section-head"},[el("span",{text:"Loss log"})]));
    if(state.losses.length===0){
      main.appendChild(el("div",{class:"empty",text:"No losses recorded yet. Sync to pull them from your Torn attack log."}));
    } else {
      const table = el("table");
      const thead = el("thead",{},[el("tr",{},["Date","Attacker","Rate applied"].map((h,i)=>el("th",{class:i===2?"num":"",text:h})))]);
      const tbody = el("tbody");
      [...state.losses].reverse().forEach(l=>{
        tbody.appendChild(el("tr",{},[
          el("td",{text:fmtDate(l.timestamp)}),
          el("td",{text:l.attackerName}),
          el("td",{class:"num",text:fmt(l.rate)}),
        ]));
      });
      table.appendChild(thead); table.appendChild(tbody);
      main.appendChild(table);
    }
  }

  if(state.tab==="settings"){
    const wrap = el("div",{class:"settings-form"});
    wrap.appendChild(el("div",{class:"section-head"},[el("span",{text:"Settings"})]));
    wrap.appendChild(el("label",{class:"label",text:"Torn API key"}));
    const keyInput = el("input",{type:"password",placeholder:"Paste your Torn API key"});
    keyInput.value = state.keyInput;
    keyInput.addEventListener("input", e=>{ state.keyInput = e.target.value; });
    wrap.appendChild(keyInput);
    wrap.appendChild(el("div",{class:"hint",text:"A Limited Access key with \"attacks\", \"basic\", and \"log\" selections enabled. Stored only in this browser's local storage."}));

    wrap.appendChild(el("label",{class:"label",style:"margin-top:18px;",text:"Rate per loss"}));
    const rateInputEl = el("input",{type:"number",placeholder:"250000"});
    rateInputEl.value = state.rateInput;
    rateInputEl.addEventListener("input", e=>{ state.rateInput = e.target.value; });
    wrap.appendChild(rateInputEl);
    wrap.appendChild(el("div",{class:"hint",text:"Applied automatically to every newly-synced loss."}));

    wrap.appendChild(el("button",{class:"primary-btn",text:"Save settings",style:"margin-top:20px;width:fit-content;", onclick: saveSettings}));

    if(state.settingsMessage){
      const isOk = state.settingsMessage.type === "ok";
      wrap.appendChild(el("div",{
        class: isOk ? "hint" : "hint",
        style: `margin-top:10px; color:${isOk ? "#8fc99a" : "#dba86b"};`,
        text: (isOk ? "✓ " : "⚠ ") + state.settingsMessage.text,
      }));
    }

    if(state.settings.ownName){
      const info = el("div",{class:"hint",style:"margin-top:16px;"});
      info.innerHTML = `Currently syncing attacks against <strong style="color:#e8e4d8">${state.settings.ownName}</strong> (ID ${state.settings.ownId}).`;
      wrap.appendChild(info);
    }
    main.appendChild(wrap);
  }
}

render();
</script>
</body>
</html>
